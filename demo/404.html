<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SEAM page not found." />
    <title>Page Not Found · SEAM</title>
    <link rel="icon" type="image/svg+xml" href="./seam-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <style>
      :root {
        --navy: #0B2545;
        --amber: #F59E0B;
        --paper: #FFFFFF;
        --paper-2: #F6F7F9;
        --muted: rgba(11,37,69,.58);
        --rule: rgba(11,37,69,.10);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          linear-gradient(var(--rule) 1px, transparent 1px),
          linear-gradient(90deg, var(--rule) 1px, transparent 1px),
          var(--paper-2);
        background-size: 34px 34px;
        color: var(--navy);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 560px);
        padding: 34px;
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: rgba(255,255,255,.92);
        box-shadow: 0 24px 64px rgba(11,37,69,.14);
        text-align: center;
      }
      img {
        width: 92px;
        height: 92px;
        display: block;
        margin: 0 auto 18px;
      }
      .wordmark {
        font-family: Sora, Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 38px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
      }
      .wordmark span { color: var(--amber); }
      .code {
        margin-top: 10px;
        color: var(--muted);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 28px 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }
      p {
        margin: 0 auto;
        max-width: 42rem;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }
      a {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        padding: 0 16px;
        border-radius: 8px;
        background: var(--navy);
        color: var(--paper);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #12345f; }
    </style>
  </head>
  <body>
    <main>
      <img src="./seam-mark-animated.svg" alt="" />
      <div class="wordmark">SE<span>A</span>M</div>
      <div class="code">404 · Page not found</div>
      <h1>This route is not available.</h1>
      <p>The SEAM portfolio demo could not find the page you requested. Return to the demo workspace to continue exploring the maritime intelligence interface.</p>
      <a href="./index.html">Return to SEAM</a>
    </main>
  </body>
</html>
