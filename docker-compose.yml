services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: seam
      POSTGRES_USER: seam
      POSTGRES_PASSWORD: seam
    ports:
      - "5432:5432"
    volumes:
      - seam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seam -d seam"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://seam:seam@db:5432/seam
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  seam_postgres_data:
